<section>
  <button class="fav-btn" (click)="alterarFavorito()">
    <span>{{ book.favorite ? '\u2764' : '\u2661' }}</span>
  </button>
  <div class="info-book">
    <div class="image-book">
      <img [src]="book.image" [alt]="book.titulo"/>
    </div>
    <h2 class="text-h2">{{ book.titulo }}</h2>
    <h3 class="text-h3">{{ book.autoria }}</h3>
  </div>
</section>
