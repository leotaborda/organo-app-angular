<section class="genres">
  <h3 class="text-h3-silver">
    {{ genre().value }}
  </h3>
  <span class="highlight-text highlight-text--small"></span>
  @if (genre().books.length === 0) {
    <div class="text-none">
      <img src="/images/sem-livros.png" alt="Sem livros nesse gênero">
      <p>Não há livros nesse gênero no momento ☹️</p>
    </div>
  }
  <div class="books-genre">
    @for (book of genre().books; track book) {
      <app-book [book]="book"></app-book>
    }
  </div>
</section>
